<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/book-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de Cadastro de Livros - Gerencie sua biblioteca pessoal">
  <meta name="keywords" content="livros, biblioteca, cadastro, gerenciamento">
  <meta name="author" content="Sistema de Livros">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sistema de Cadastro de Livros">
  <meta property="og:description" content="Gerencie sua biblioteca pessoal de forma simples e eficiente">
  <meta property="og:image" content="/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Sistema de Cadastro de Livros">
  <meta property="twitter:description" content="Gerencie sua biblioteca pessoal de forma simples e eficiente">
  
  <title>📚 Sistema de Livros</title>
  
  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon alternatives -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#4F46E5">
  
  <style>
    /* Loading spinner inicial */
    .initial-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      color: #6b7280;
      font-size: 14px;
      font-weight: 500;
    }
    
    /* Hide loading when Vue is ready */
    .vue-ready .initial-loading {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading inicial -->
  <div class="initial-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando Sistema de Livros...</div>
  </div>

  <!-- App Vue -->
  <div id="app"></div>
  
  <!-- Service Worker para PWA (opcional) -->
  <script>
    // Adicionar classe quando Vue estiver carregado
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.body.classList.add('vue-ready');
      }, 100);
    });
    
    // Registrar Service Worker (opcional para PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('SW registered: ', registration);
          })
          .catch((registrationError) => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
